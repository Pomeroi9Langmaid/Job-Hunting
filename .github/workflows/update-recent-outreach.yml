name: Update recent outreach

on:
  push:
    paths:
      - '.github/workflows/update-recent-outreach.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update applications CSV
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          path = Path('data/applications.csv')
          with path.open(newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))
              fieldnames = rows[0].keys()

          updates = {
              '71': {
