name: Update engcon contact
on:
  push:
    paths:
      - .github/workflows/update-engcon-contact.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          import csv
          p='data/applications.csv'
          with open(p, newline='', encoding='utf-8') as f:
              rows=list(csv.reader(f))
          for row in rows:
              if row and row[0]=='146':
                  row[8]='Stig Engström'
                  row[9]='CEO'
                  row[10]='28 Jul 2026'
                  row[11]='Awaiting Response'
                  row[16]='No advertised role. Direct speculative email.'
                  row[17]='Initial email sent 28 July 2026 to former CEO Krister Blomgren produced an automated redirect. Replacement email sent the same day to current CEO Stig Engström at stig.engstrom@engcon.com with Andrew_Langmaid_engcon.pdf attached. Subject: Andrew Langmaid.'
                  row[18]=''
          with open(p,'w',newline='',encoding='utf-8') as f:
              csv.writer(f,lineterminator='\n').writerows(rows)
          PY
      - run: |
          rm .github/workflows/update-engcon-contact.yml
          git config user.name github-actions
          git config user.email actions@github.com
          git add data/applications.csv .github/workflows/update-engcon-contact.yml
          git commit -m 'Update engcon contact to Stig Engstrom'
          git push
