name: Update Brokk and engcon outreach
on:
  push:
    paths:
      - .github/workflows/update-brokk-engcon-outreach.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          import csv
          p='data/applications.csv'
          with open(p, newline='', encoding='utf-8') as f:
              rows=list(csv.reader(f))
          for row in rows:
              if row and row[0]=='145':
                  row[1]='28 Jul 2026'
                  row[2]='2026-07-28'
                  row[6]='Speculative Outreach'
                  row[10]='28 Jul 2026'
                  row[11]='Awaiting Response'
                  row[16]='No advertised role. Direct speculative email.'
                  row[17]='Email sent 28 July 2026 to Martin Burström with Andrew_Langmaid_Brokk.pdf attached. Subject: Andrew Langmaid.'
                  row[18]=''
              if row and row[0]=='146':
                  row[1]='28 Jul 2026'
                  row[2]='2026-07-28'
                  row[6]='Speculative Outreach'
                  row[10]='28 Jul 2026'
                  row[11]='Awaiting Response'
                  row[16]='No advertised role. Direct speculative email.'
                  row[17]='Email sent 28 July 2026 to Krister Blomgren with Andrew_Langmaid_engcon.pdf attached. Subject: Andrew Langmaid.'
                  row[18]=''
          with open(p,'w',newline='',encoding='utf-8') as f:
              csv.writer(f,lineterminator='\n').writerows(rows)
          PY
      - run: |
          rm .github/workflows/update-brokk-engcon-outreach.yml
          git config user.name github-actions
          git config user.email actions@github.com
          git add data/applications.csv .github/workflows/update-brokk-engcon-outreach.yml
          git commit -m 'Update Brokk and engcon outreach'
          git push
