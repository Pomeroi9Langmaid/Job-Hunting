name: Record Axentia application 16 Aug 2026
on:
  push:
    paths:
      - .github/workflows/record-axentia-application-2026-08-16.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update tracker
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          p = Path('data/applications.csv')
          with p.open(newline='', encoding='utf-8') as f:
              rows = list(csv.reader(f))

          header = rows[0]
          data = rows[1:]

          # Correct the earlier Axentia speculative-outreach history without losing it.
          for row in data:
              if row and row[0] == '148':
                  row[11] = 'Active'
                  row[16] = 'Direct speculative approach sent before formal application to an already advertised role.'
                  row[17] = ('Email sent 28 July 2026 to Pontus Arvidsson with '
                             'Andrew_Langmaid_Axentia_Technologies.pdf attached. '
                             'Reply received 4 August 2026: Pontus found Andrew\'s background interesting '
                             'and forwarded the approach to Axentia\'s Sales Manager and HR Manager. '
                             'Formal application to Strategic Business Development Manager Nordics submitted '
                             '16 August 2026. Subject: Andrew Langmaid.')

          if not any(row and row[0] == '297' for row in data):
              data.append([
                  '297',
                  '16 Aug 2026',
                  '2026-08-16',
                  'Axentia Technologies',
                  'Linköping / Hybrid',
                  'Strategic Business Development Manager Nordics',
                  'Open Role Application',
                  'https://pnty-apply.ponty-system.se/asbexecutive?by=1&id=3426&r=1',
                  '',
                  '',
                  '16 Aug 2026',
                  'Active',
                  '',
                  '0',
                  '',
                  '',
                  'Applied through AS&B Executive / Ponty recruitment system.',
                  ('Formal application submitted 16 August 2026 with tailored CV '
                   'Andrew_Langmaid_Axentia_Technologies.pdf and cover letter '
                   'Andrew_Langmaid_Axentia_Cover_Letter.pdf. Prior speculative approach sent '
                   '28 July 2026; Pontus Arvidsson replied 4 August and forwarded Andrew\'s details '
                   'to Axentia\'s Sales Manager and HR Manager. Application review: Tier B, approximately '
                   '80/100. Main practical concern: Linköping office preference of around three days per week.'),
                  ''
              ])

          with p.open('w', newline='', encoding='utf-8') as f:
              csv.writer(f, lineterminator='\n').writerows([header] + data)
          PY
      - name: Commit tracker update
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add data/applications.csv
          git commit -m 'Record Axentia advertised-role application' || true
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/record-axentia-application-2026-08-16.yml
          git commit -m 'Remove temporary Axentia tracker workflow'
          git push
