name: Update completed outreach

on:
  push:
    paths:
      - '.github/workflows/update-outreach-2026-07-27.yml'

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update applications tracker
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          path = Path('data/applications.csv')
          with path.open(newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))
              fieldnames = list(rows[0].keys())

          updates = {
              '71': {
                  'activity_date': '27 Jul 2026',
                  'date_sort': '2026-07-27',
                  'activity_type': 'Speculative Outreach',
                  'contacted_date': '27 Jul 2026',
                  'current_status': 'Awaiting Response',
                  'route_reason': 'No advertised role. Direct speculative email.',
                  'notes': 'Email sent 27 July 2026 to Peter Andersson with Andrew_Langmaid_LumenRadio.pdf attached. Subject: Andrew Langmaid.'
              },
              '134': {
                  'activity_date': '27 Jul 2026',
                  'date_sort': '2026-07-27',
                  'activity_type': 'Speculative Outreach',
                  'contacted_date': '27 Jul 2026',
                  'current_status': 'Awaiting Response',
                  'route_reason': 'No advertised role. Direct speculative email.',
                  'notes': 'Email sent 27 July 2026 to Tobias Nilsson with Andrew_Langmaid_Web_Manuals.pdf attached. Subject: Andrew Langmaid.'
              },
              '95': {
                  'activity_date': '27 Jul 2026',
                  'date_sort': '2026-07-27',
                  'activity_type': 'Speculative Outreach',
                  'contacted_date': '27 Jul 2026',
                  'current_status': 'Awaiting Response',
                  'route_reason': 'No advertised role. Direct speculative email.',
                  'notes': 'Email sent 27 July 2026 to Maria Green Danell with Andrew_Langmaid_Volumental.pdf attached. Subject: Andrew Langmaid.'
              },
              '141': {
                  'activity_date': '27 Jul 2026',
                  'date_sort': '2026-07-27',
                  'activity_type': 'Speculative Outreach',
                  'contacted_date': '27 Jul 2026',
                  'current_status': 'Awaiting Response',
                  'route_reason': 'No advertised role. Direct speculative email.',
                  'notes': 'Email sent 27 July 2026 to Mikael Lindholm with Andrew_Langmaid_ScandiNova.pdf attached. Subject: Andrew Langmaid.'
              }
          }

          found = set()
          for row in rows:
              if row['id'] in updates:
                  row.update(updates[row['id']])
                  found.add(row['id'])

          missing = set(updates) - found
          if missing:
              raise SystemExit(f'Missing tracker IDs: {sorted(missing)}')

          with path.open('w', newline='', encoding='utf-8') as f:
              writer = csv.DictWriter(f, fieldnames=fieldnames)
              writer.writeheader()
              writer.writerows(rows)
          PY
      - name: Commit tracker update and remove temporary workflow
        run: |
          rm .github/workflows/update-outreach-2026-07-27.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/applications.csv .github/workflows/update-outreach-2026-07-27.yml
          git commit -m 'Record LumenRadio Web Manuals Volumental and ScandiNova outreach'
          git push
