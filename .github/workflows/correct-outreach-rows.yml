name: Correct outreach rows
on:
  push:
    paths:
      - .github/workflows/correct-outreach-rows.yml
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          import csv
          p='data/applications.csv'
          with open(p, newline='', encoding='utf-8') as f:
              rows=list(csv.reader(f))
          for row in rows:
              if row and row[0]=='143':
                  del row[19:]
                  row[16]='No advertised role. Direct speculative email.'
                  row[17]='Email sent 28 July 2026 to Daniel Rossing Cabernér with Andrew_Langmaid_Epishine.pdf attached. Subject: Andrew Langmaid.'
                  row[18]=''
              if row and row[0]=='144':
                  del row[19:]
                  row[16]='No advertised role. Direct speculative email.'
                  row[17]='Email sent 28 July 2026 to Fredrik Falk with Andrew_Langmaid_Micropower_Group.pdf attached. Subject: Andrew Langmaid.'
                  row[18]=''
          with open(p,'w',newline='',encoding='utf-8') as f:
              csv.writer(f,lineterminator='\n').writerows(rows)
          PY
      - run: |
          rm .github/workflows/correct-outreach-rows.yml
          git config user.name github-actions
          git config user.email actions@github.com
          git add data/applications.csv .github/workflows/correct-outreach-rows.yml
          git commit -m 'Correct outreach tracker rows'
          git push
