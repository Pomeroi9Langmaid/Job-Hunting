name: Update Axentia and Algoryx tracker rows
on:
  push:
    paths:
      - .github/workflows/update-axentia-and-algoryx.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          import csv
          p='data/applications.csv'
          with open(p, newline='', encoding='utf-8') as f:
              rows=list(csv.reader(f))
          for row in rows:
              if row and row[0]=='147':
                  row[11]='Not Pursued'
                  row[15]='Screened out before contact because the specialist physics-simulation and engineering domain was not a credible fit.'
                  row[16]='No outreach sent. Draft deleted after fit review.'
                  row[17]=''
                  row[18]=''
              if row and row[0]=='148':
                  row[1]='28 Jul 2026'
                  row[2]='2026-07-28'
                  row[6]='Speculative Outreach'
                  row[10]='28 Jul 2026'
                  row[11]='Awaiting Response'
                  row[15]=''
                  row[16]='No advertised role. Direct speculative email.'
                  row[17]='Email sent 28 July 2026 to Pontus Arvidsson with Andrew_Langmaid_Axentia_Technologies.pdf attached. Subject: Andrew Langmaid.'
                  row[18]=''
          with open(p,'w',newline='',encoding='utf-8') as f:
              csv.writer(f,lineterminator='\n').writerows(rows)
          PY
      - run: |
          rm .github/workflows/update-axentia-and-algoryx.yml
          git config user.name github-actions
          git config user.email actions@github.com
          git add data/applications.csv .github/workflows/update-axentia-and-algoryx.yml
          git commit -m 'Update Axentia outreach and Algoryx screening'
          git push
