name: Update Stille and Palats outreach records
on:
  push:
    paths:
      - '.github/workflows/update-stille-palats-20260728.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update applications CSV
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          path = Path('data/applications.csv')
          with path.open(newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))
              fieldnames = list(rows[0].keys())

          for row in rows:
              if row['id'] == '153' and row['company'] == 'Stille':
                  row.update({
                      'activity_date': '28 Jul 2026',
                      'date_sort': '2026-07-28',
                      'activity_type': 'Speculative Outreach',
                      'contacted_date': '28 Jul 2026',
                      'current_status': 'Awaiting Response',
                      'route_reason': 'No advertised role. Direct speculative email.',
                      'notes': 'Email sent 28 July 2026 to Ulrik Berthelsen with Andrew_Langmaid_Stille.pdf attached. Subject: Andrew Langmaid. Andrew revised the company-specific wording before sending.'
                  })

          if not any(row['company'] == 'Palats' for row in rows):
              new_row = {name: '' for name in fieldnames}
              new_row.update({
                  'id': '155',
                  'activity_date': '28 Jul 2026',
                  'date_sort': '2026-07-28',
                  'company': 'Palats',
                  'city': 'Gothenburg',
                  'job_title': 'International business development approach',
                  'activity_type': 'Speculative Outreach',
                  'contact_name': 'Henrik Olausson',
                  'contact_title': 'Co-founder & CEO',
                  'contacted_date': '28 Jul 2026',
                  'current_status': 'Awaiting Response',
                  'interview_count': '0',
                  'route_reason': 'No advertised role. Direct speculative email.',
                  'notes': 'Email sent 28 July 2026 to Henrik Olausson with Andrew_Langmaid_Palats.pdf attached. Subject: Andrew Langmaid. Andrew revised the company-specific wording before sending.'
              })
              rows.append(new_row)

          with path.open('w', newline='', encoding='utf-8') as f:
              writer = csv.DictWriter(f, fieldnames=fieldnames, lineterminator='\n')
              writer.writeheader()
              writer.writerows(rows)
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/update-stille-palats-20260728.yml
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/applications.csv .github/workflows/update-stille-palats-20260728.yml
          git commit -m 'Record Stille and Palats speculative outreach'
          git push